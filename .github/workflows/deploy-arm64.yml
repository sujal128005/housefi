name: Deploy images (arm64)

# Builds the server images for arm64 (Oracle Cloud's free Ampere servers) and starts the database with PostGIS,
# whenever the deploy kit changes. Runs on an amd64 runner with QEMU, so it is slow; it only runs when needed.
on:
  pull_request:
    paths: ['backend/Dockerfile', 'backend/deploy/**', 'backend/package-lock.json', 'backend/prisma/**', '.github/workflows/deploy-arm64.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Database image (PostgreSQL 16 + PostGIS) for arm64
        run: docker buildx build --platform linux/arm64 --load -t housefi-postgis:test -f backend/deploy/postgis.Dockerfile backend/deploy
      - name: Start it and create the PostGIS extension
        run: |
          docker run -d --name pg --platform linux/arm64 -e POSTGRES_PASSWORD=test -e POSTGRES_DB=housefi housefi-postgis:test
          # Under QEMU the first start (initdb) is slow: wait up to 10 minutes for the final server, not the setup one.
          ok=
          for i in $(seq 1 120); do
            if docker logs pg 2>&1 | grep -q "PostgreSQL init process complete" && docker exec pg pg_isready -U postgres -d housefi; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then echo "::error title=arm64 database::did not become ready"; docker logs pg 2>&1 | tail -40; exit 1; fi
          docker exec pg psql -U postgres -d housefi -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;" -c "SELECT postgis_full_version();" || { docker logs pg 2>&1 | tail -40; exit 1; }
          docker exec pg uname -m
      - name: API image for arm64
        run: docker buildx build --platform linux/arm64 -t housefi-api:test -f backend/Dockerfile backend
