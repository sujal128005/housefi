openapi: 3.1.0
info:
  title: Housefi API
  version: 1.0.0-draft
  description: |
    Contract between the Housefi app (customer + technician) and the backend.
    Mirrors src/services/api.ts and src/domain/types.ts in the app repo. If they disagree, the app files win; raise it.
    Conventions: JSON camelCase; money = integer rupees; timestamps = epoch milliseconds; dates = "YYYY-MM-DD" (IST);
    errors = { "error": { "code", "message", ... } } with the codes in ErrorBody.
servers:
  - url: http://localhost:4000/v1
    description: local
  - url: https://api.housefi.tech/v1
    description: production
security:
  - bearer: []
tags:
  - name: chat
    description: Customer and assigned technician, from assignment until the job is done; cleared after.
  - name: auth
  - name: me
  - name: catalog
  - name: places
    description: India Post's All India Pincode Directory (states, districts, localities, PIN codes) for address forms.
  - name: addresses
  - name: bookings
  - name: payments
  - name: uploads
  - name: ai
  - name: notifications
  - name: support
  - name: technician
  - name: skills
  - name: courses
  - name: coordinator
  - name: identity
  - name: telephony

paths:
  # ---------------- auth ----------------
  /auth/otp/request:
    post:
      tags: [auth]
      security: []
      summary: Send a 6-digit SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, role]
              properties:
                phone: { type: string, pattern: '^[6-9][0-9]{9}$', description: '10-digit Indian mobile, without +91' }
                role: { type: string, enum: [CUSTOMER, TECHNICIAN] }
      responses:
        '200':
          description: Code sent
          content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      summary: Verify the code; signs in or signs up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Signed in. Exactly one of customer / technician is present, matching the challenge role.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotate the refresh token (call at app start and on 401)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200':
          description: New token pair
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { refreshToken: { type: string } } }
      responses:
        '204': { description: Signed out }

  # ---------------- me ----------------
  /me:
    get:
      tags: [me]
      summary: Signed-in customer
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
    patch:
      tags: [me]
      summary: Update name and/or language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [me]
      summary: Delete account (DPDP erasure; bookings are anonymised)
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }

  # ---------------- catalog ----------------
  /catalog/categories:
    get:
      tags: [catalog]
      security: []
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
  /catalog/services:
    get:
      tags: [catalog]
      security: []
      parameters:
        - { name: categoryId, in: query, schema: { $ref: '#/components/schemas/CategoryId' } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Service' } } } }
  /catalog/services/{serviceId}:
    get:
      tags: [catalog]
      security: []
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Service' } } } }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- addresses ----------------
  /catalog/greeting:
    get:
      tags: [catalog]
      security: []
      description: The festive greeting for the home screens today (festivals.ts on the server), or null on ordinary days.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Greeting' }, { type: 'null' }] } } }
  # ---------------- places ----------------
  /places/states:
    get:
      tags: [places]
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /places/districts:
    get:
      tags: [places]
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /places/localities:
    get:
      tags: [places]
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: district, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Locality' } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /places/pincodes/{pincode}:
    get:
      tags: [places]
      security: []
      parameters:
        - { name: pincode, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PincodePlaces' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /places/near:
    get:
      tags: [places]
      security: []
      description: >-
        The locality where the phone is, to fill an address form in one tap. India Post's positions are sometimes
        kilometres off, so the phone's own map lookup leads: `pincode` and `area` (its place names, comma-separated)
        pick among the localities with that PIN code. Without a known PIN: the nearest locality within 25 km.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: pincode, in: query, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
        - { name: area, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NearPlace' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /addresses:
    get:
      tags: [addresses]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Address' } } } }
    post:
      tags: [addresses]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /addresses/{addressId}:
    parameters:
      - { name: addressId, in: path, required: true, schema: { type: string } }
    put:
      tags: [addresses]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [addresses]
      responses:
        '204': { description: Removed (soft delete; past bookings keep their copy) }

  # ---------------- slots + bookings ----------------
  /eta:
    get:
      tags: [bookings]
      summary: 'Before booking "Now": roughly when a technician could arrive (minutes only)'
      description: >-
        From the nearest technician who could take the job right now (the same rules as an offer): matching, accepting,
        getting ready and the trip at the time of day's city speed, as a 10-minute range rounded up to 5 minutes.
        null when nobody is free nearby or the address has no map point. Never reveals anyone's location.
      parameters:
        - { name: serviceId, in: query, required: true, schema: { type: string } }
        - { name: addressId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [minutes]
                properties:
                  minutes: { oneOf: [{ type: array, items: { type: integer }, minItems: 2, maxItems: 2 }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/Error' }
  /slots:
    get:
      tags: [bookings]
      summary: Six 2-hour windows (8-20) for a date; CLOSED within 60 min of start
      parameters:
        - { name: serviceId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Slot' } } } }
  /bookings:
    get:
      tags: [bookings]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [active, past, all], default: all } }
      responses:
        '200':
          description: Newest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Booking' } } } }
    post:
      tags: [bookings]
      summary: Create a booking (waits for the ₹49 visit fee)
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewBooking' } } }
      responses:
        '201': { description: Created (status AWAITING_PAYMENT), content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [bookings]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/technician-card:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [bookings, identity]
      summary: Digital ID card of the technician assigned to this booking
      description: >-
        Only for the customer who owns the booking, once a technician is assigned and while the booking is not cancelled or unfulfilled. Anything else is 404
        (never reveal that another person's booking exists). Shows the approved photo only. No caching (Cache-Control: no-store).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechIdCard' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/stream:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [bookings]
      summary: Live updates (Server-Sent Events). Each event `booking` carries the full Booking JSON.
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
  /bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { oneOf: [{ $ref: '#/components/schemas/CancelReason' }, { type: 'null' }] } } }
      responses:
        '200': { description: Cancelled (visitPayment REFUNDED if before EN_ROUTE), content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/coupon:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      summary: Puts a coupon on the final bill (PAYMENT_DUE, before paying). A code that cannot be used is answered with why (applied false), not an error
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 30 } } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [applied, problem, discount, booking]
                properties:
                  applied: { type: boolean }
                  problem: { type: [string, 'null'], enum: [UNKNOWN, INACTIVE, NOT_YET, EXPIRED, USED_UP, ALREADY_USED, FIRST_BOOKING_ONLY, BILL_TOO_SMALL, null] }
                  discount: { type: integer }
                  booking: { $ref: '#/components/schemas/Booking' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [bookings]
      summary: Takes the coupon off the final bill (before paying)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/warranty:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      summary: '"Not fixed? Free revisit" within 15 days of a completed job (once): a new booking, visit fee paid by Housefi, same technician first'
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 400 } } } } }
      responses:
        '201': { description: The revisit booking, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/invoice-link:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      summary: A download link for the invoice PDF of a finished booking (path to add to the API base; valid 15 minutes)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [path, expiresAt], properties: { path: { type: string }, expiresAt: { $ref: '#/components/schemas/EpochMs' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /invoices/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [bookings]
      summary: The invoice PDF behind a signed link (no sign-in; the link is the key; 404 when wrong or expired)
      security: []
      responses:
        '200': { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/reschedule:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [time], properties: { time: { $ref: '#/components/schemas/VisitTime' } } }
      responses:
        '200': { description: Back to MATCHING, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/quotes/{which}/answer:
    parameters:
      - $ref: '#/components/parameters/BookingId'
      - { name: which, in: path, required: true, schema: { type: string, enum: [MAIN, EXTRA] } }
    post:
      tags: [bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [APPROVE, REVISION, DECLINE], description: REVISION only for MAIN }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/rating:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RatingInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /chats:
    get:
      tags: [chat]
      summary: The customer's chats that are open or have messages, with unread counts (the chat bubble)
      responses:
        '200':
          description: Newest booking first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatSummary' } } } }
  /bookings/{bookingId}/chat:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [chat]
      summary: The chat with the assigned technician (reading it marks it read)
      description: Only messages since the current technician was assigned. 409 before a technician is assigned.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Chat' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [chat]
      summary: Send words and/or a photo (an upload with stage CHAT)
      description: From assignment until the job is done (409 otherwise). At most 30 messages a minute. The other side gets a CHAT_MESSAGE notification (never the text).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessageInput' } } }
      responses:
        '200': { description: The chat after sending, content: { application/json: { schema: { $ref: '#/components/schemas/Chat' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [chat]
      summary: Clear the chat (messages and photos, for both sides); only once the job is done
      description: 409 while the job is on. Finished chats are also cleared by themselves 24 h after the job.
      responses:
        '204': { description: Cleared }
        '409': { $ref: '#/components/responses/Error' }
  /tech/chats:
    get:
      tags: [chat]
      summary: The technician's chats that are open or have messages, with unread counts
      responses:
        '200':
          description: Newest booking first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatSummary' } } } }
  /tech/jobs/{jobId}/chat:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [chat]
      summary: The chat with the customer of the job (reading it marks it read)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Chat' } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [chat]
      summary: Send words and/or a photo to the customer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessageInput' } } }
      responses:
        '200': { description: The chat after sending, content: { application/json: { schema: { $ref: '#/components/schemas/Chat' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [chat]
      summary: Clear the chat; only once the job is done
      responses:
        '204': { description: Cleared }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/call:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      summary: Masked call to the assigned technician (Exotel)
      description: >-
        From assignment until payment. Returns the Housefi number; dialling it within 30 minutes connects to the technician
        without revealing either number. 409 outside that window; 503 when phone calls are off (TELEPHONY_PROVIDER=off).
      responses:
        '200':
          description: Number to dial; it connects to the technician without revealing either number
          content: { application/json: { schema: { $ref: '#/components/schemas/DialNumber' } } }
        '409': { $ref: '#/components/responses/Error' }

  # ---------------- payments ----------------
  /bookings/{bookingId}/payments:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [payments]
      summary: Start paying the visit fee (VISIT) or the bill (FINAL). CASH only for FINAL.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, method]
              properties:
                kind: { type: string, enum: [VISIT, FINAL] }
                method: { $ref: '#/components/schemas/PaymentMethod' }
      responses:
        '200':
          description: Razorpay order to open in the checkout sheet, or the booking (cash, waiting for the technician to confirm)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaymentOrder'
                  - $ref: '#/components/schemas/Booking'
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /payments/{paymentId}/verify:
    parameters:
      - { name: paymentId, in: path, required: true, schema: { type: string } }
    post:
      tags: [payments]
      summary: Called after the Razorpay sheet returns; verifies the signature server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
              properties:
                razorpayOrderId: { type: string }
                razorpayPaymentId: { type: string }
                razorpaySignature: { type: string }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResult' } } } }
        '402': { $ref: '#/components/responses/Error' }
  /webhooks/razorpay:
    post:
      tags: [payments]
      security: []
      summary: Razorpay events (payment.captured, payment.failed, refund.processed). Verify X-Razorpay-Signature; dedupe by event id.
      responses:
        '200': { description: Accepted }

  # ---------------- uploads ----------------
  /uploads/photos:
    post:
      tags: [uploads]
      summary: Get a signed URL to PUT one photo (jpeg/png/heic, max 8 MB). EXIF location is stripped server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, bytes]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/heic] }
                bytes: { type: integer, maximum: 8388608 }
                stage: { type: string, enum: [PROBLEM, INSPECTION, COMPLETION, PROFILE, CHAT], default: PROBLEM, description: 'Customers: PROBLEM, CHAT. Technicians: INSPECTION, COMPLETION, PROFILE (registration photo), CHAT. Coordinators: PROFILE only.' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }
  /uploads/audio:
    post:
      tags: [uploads]
      summary: Signed URL for one voice note (audio/m4a, max 2 MB, max 60 s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, bytes]
              properties:
                contentType: { type: string, enum: [audio/m4a, audio/mp4, audio/aac] }
                bytes: { type: integer, maximum: 2097152 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }

  /uploads/videos:
    post:
      tags: [uploads]
      summary: Signed URL for a technician's work video (video/mp4 or video/quicktime, max 100 MB, max 2 min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, bytes]
              properties:
                contentType: { type: string, enum: [video/mp4, video/quicktime] }
                bytes: { type: integer, maximum: 104857600 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }
  /uploads/documents:
    post:
      tags: [uploads]
      summary: Signed URL for a technician's certificate (PDF or photo, max 10 MB)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, bytes]
              properties:
                contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/heic] }
                bytes: { type: integer, maximum: 10485760 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }

  # ---------------- ai ----------------
  /ai/top-problems:
    get:
      tags: [ai]
      summary: The 6 problems most booked around a PIN code (city-wide if no PIN)
      parameters:
        - { name: pincode, in: query, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LocalTopProblems' } } } }
  /ai/classify-photo:
    post:
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [photoId], properties: { photoId: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSuggestion' } } } }
  /ai/transcribe:
    post:
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioId, locale]
              properties:
                audioId: { type: string }
                serviceId: { type: [string, 'null'] }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { text: { type: string } } } } }
  /ai/chat:
    post:
      tags: [ai]
      summary: Support assistant. Answers only about the caller's own bookings; offers a human when unsure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, locale]
              properties:
                message: { type: string, maxLength: 1000 }
                locale: { $ref: '#/components/schemas/Locale' }
                conversationId: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChatReply' } } } }

  # ---------------- notifications ----------------
  /notifications:
    get:
      tags: [notifications]
      summary: Inbox for the signed-in user (either role), newest first
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AppNotification' } } } }
  /notifications/read:
    post:
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } }
      responses:
        '204': { description: OK }
  /devices:
    post:
      tags: [notifications]
      summary: Register this device's push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken, platform]
              properties:
                pushToken: { type: string }
                platform: { type: string, enum: [ios, android, web] }
      responses:
        '204': { description: OK }

  # ---------------- support ----------------
  /support/callback:
    post:
      tags: [support]
      summary: Ask customer care to call back
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId: { type: string }
                reason: { type: string, maxLength: 300 }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { ticketId: { type: string } } } } } }
  /support/tickets:
    post:
      tags: [support]
      summary: Raise an issue (customer SOS "alert team" uses kind UNSAFE, priority URGENT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                bookingId: { type: string }
                kind: { type: string, enum: [UNSAFE, PAYMENT_PROBLEM, OTHER] }
                note: { type: string, maxLength: 1000 }
                location: { $ref: '#/components/schemas/Position' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { ticketId: { type: string } } } } } }
  /support/conversation:
    get:
      tags: [support]
      summary: The live conversation with the Housefi team (open, or closed in the last day), or null
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [conversation], properties: { conversation: { oneOf: [{ $ref: '#/components/schemas/SupportConversation' }, { type: 'null' }] } } } } } }
    post:
      tags: [support]
      summary: Talk to the Housefi team, after the assistant asked what it is about (returns the open one if there is one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, text]
              properties:
                topic: { type: string, enum: [BOOKING, PAYMENT, TECHNICIAN, APP, OTHER] }
                bookingId: { type: [string, 'null'] }
                text: { type: string, maxLength: 1000 }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, required: [conversation], properties: { conversation: { $ref: '#/components/schemas/SupportConversation' } } } } } }
        '422': { $ref: '#/components/responses/Error' }
  /support/conversation/messages:
    post:
      tags: [support]
      summary: Write in the open conversation
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [conversation], properties: { conversation: { $ref: '#/components/schemas/SupportConversation' } } } } } }
        '409': { description: No open conversation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }

  # ---------------- technician ----------------
  /tech/me:
    get:
      tags: [technician]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechProfile' } } } }
  /tech/profile:
    put:
      tags: [technician]
      summary: Submit or correct the profile; verification becomes PENDING
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TechProfileInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechProfile' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /tech/id-card:
    get:
      tags: [technician, identity]
      summary: The signed-in technician's own digital ID card (Cache-Control no-store)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechIdCard' } } } }
        '404': { description: Profile not submitted yet, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
  /tech/aadhaar:
    post:
      tags: [technician, identity]
      summary: Verify Aadhaar offline from the Secure QR on the card (UIDAI signature checked on the server)
      description: >-
        The app scans the Secure QR code and sends its text. Nothing is sent to UIDAI. Stored: the last 4 digits, the
        birth year, the gender, whether the name matches the legal name, and a one-way fingerprint that stops one Aadhaar
        being used for two technician accounts. Never the Aadhaar number, photo or address. 409 when the Aadhaar is already
        used by another account; 422 for an invalid or unsigned QR, or a person under 18; 503 when UIDAI_QR_CERT_PEM_B64 is
        not configured. Approval needs a verified Aadhaar (AADHAAR_REQUIRED).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AadhaarInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AadhaarResult' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tech/passport:
    get:
      tags: [technician, identity]
      summary: The technician's own Skill Passport, whether it shows on the public QR page, and that page's link (no-store)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyPassport' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [technician, identity]
      summary: Show or hide the Skill Passport on the public QR page (off by default)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public]
              properties:
                public: { type: boolean }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyPassport' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /tech/identity-corrections:
    post:
      tags: [technician, identity]
      summary: Ask support to correct the legal name or photo (technicians cannot change them directly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, note]
              properties:
                kind: { type: string, enum: [NAME, PHOTO] }
                note: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechProfile' } } } }
  /tech/skills:
    get:
      tags: [technician, skills]
      summary: "The skill check (after the Aadhaar scan: level, exam per trade, work video, certificates)"
      description: >-
        A trade gets job offers only once verified: a passed exam, a work video HQ approved, or HQ itself. The review
        window starts when the skill check is sent (POST /tech/skills/submit). Trades from before the skill check count
        as verified (EARLIER).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
  /tech/skills/level:
    put:
      tags: [technician, skills]
      summary: The level the technician chooses (sets how hard the exam is); 409 after an exam was started
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillLevelInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/skills/exams:
    post:
      tags: [technician, skills]
      summary: Start the exam for one of the technician's trades (or get the one still running for it)
      description: >-
        10 questions: 3 MCQs (3 min), 3 diagram questions (4 min), 4 "choose the part or tool" questions (5 min); 2 points
        each, 3 for a fast right part answer; 60% to pass. The server keeps the time and the answers; the paper never
        carries them. 409 while another exam runs, for a verified trade, or before the retake time (retryAfterSec).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillExamStart' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillExam' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/skills/exams/{attemptId}:
    get:
      tags: [technician, skills]
      summary: The exam as it stands (marked once its time is up)
      parameters: [{ name: attemptId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillExam' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /tech/skills/exams/{attemptId}/sections/{index}/start:
    post:
      tags: [technician, skills]
      summary: Open the next section (in order); the section before closes
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 2 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillExam' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/skills/exams/{attemptId}/answers/{questionId}:
    put:
      tags: [technician, skills]
      summary: Answer (or change the answer to) a question of the open section, while its time runs
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string } }
        - { name: questionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillExamAnswer' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillExam' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/skills/exams/{attemptId}/left-app:
    post:
      tags: [technician, skills]
      summary: The technician left the app during the exam; the third time submits it
      parameters: [{ name: attemptId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillExam' } } } }
  /tech/skills/exams/{attemptId}/submit:
    post:
      tags: [technician, skills]
      summary: Submit the exam; the result comes back at once
      parameters: [{ name: attemptId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillExam' } } } }
  /tech/skills/video:
    post:
      tags: [technician, skills]
      summary: A 1-2 minute work video (POST /uploads/videos first) for HQ to watch; replaces one waiting or refused
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillVideoInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /tech/skills/certificates:
    post:
      tags: [technician, skills]
      summary: Add a certificate (POST /uploads/documents first); at most 4
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillCertificateInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/skills/certificates/{certificateId}:
    delete:
      tags: [technician, skills]
      summary: Remove a certificate still waiting or refused (409 for one Housefi approved)
      parameters: [{ name: certificateId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /tech/skills/submit:
    post:
      tags: [technician, skills]
      summary: Send the skill check for review (needs the level and an exam taken or a video); the review window starts now
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SkillCheck' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/courses:
    get:
      tags: [technician, courses]
      summary: Published courses (every lesson has its video), with this technician's access and progress
      description: >-
        Basic and safety courses are free; an advanced course is free with a rating of 3.8 or more, otherwise 99 rupees.
        Courses are open across trades.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Courses' } } } }
  /tech/courses/{courseId}:
    get:
      tags: [technician, courses]
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /tech/courses/{courseId}/enroll:
    post:
      tags: [technician, courses]
      summary: Start a free course (409 for an advanced course that has to be bought)
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/courses/{courseId}/payments:
    post:
      tags: [technician, courses]
      summary: Buy an advanced course (99 rupees); opens the same checkout page as bookings (SIMULATED for demo accounts)
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourseOrder' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/courses/{courseId}/payments/{paymentId}/verify:
    post:
      tags: [technician, courses]
      summary: After the checkout returns; the server checks the signature and asks Razorpay (the webhook also settles it)
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }, { name: paymentId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
              properties: { razorpayOrderId: { type: string }, razorpayPaymentId: { type: string }, razorpaySignature: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '402': { $ref: '#/components/responses/Error' }
  /tech/courses/{courseId}/lessons/{lessonId}:
    get:
      tags: [technician, courses]
      summary: A lesson to watch (signed video link); the course must be started
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }, { name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/courses/{courseId}/lessons/{lessonId}/progress:
    post:
      tags: [technician, courses]
      summary: Where the player is; the watched position moves only as fast as real time, and near the end the lesson counts as watched
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }, { name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [positionSec], properties: { positionSec: { type: number, minimum: 0 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [watchedSec, completed], properties: { watchedSec: { type: integer }, completed: { type: boolean } } } } } }
  /tech/courses/{courseId}/quiz:
    get:
      tags: [technician, courses]
      summary: The quiz, once every lesson is watched (options in a new order on every try, never the answers)
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourseQuiz' } } } }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [technician, courses]
      summary: Answer the quiz; 3 of 5 right completes the course and adds a Housefi course certification
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [answers], properties: { answers: { type: object, additionalProperties: { type: string }, description: question number to option id } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourseQuizResult' } } } }
  /tech/availability:
    post:
      tags: [technician]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [online], properties: { online: { type: boolean } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechProfile' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /tech/location:
    post:
      tags: [technician]
      summary: Location while online / on a job (every 60 s). Shown to the customer only while EN_ROUTE (Booking.technicianLocation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                accuracy: { type: number }
      responses:
        '204': { description: OK }
  /tech/offers/current:
    get:
      tags: [technician]
      responses:
        '200':
          description: The open offer for me, or null
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/JobOffer' }, { type: 'null' }] } } }
  /tech/offers/{offerId}/accept:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [technician]
      responses:
        '200': { description: Assigned, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '410': { $ref: '#/components/responses/Error' }
  /tech/offers/{offerId}/reject:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [technician]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { oneOf: [{ type: string, enum: [TOO_FAR, BUSY, NOT_MY_SKILL, OTHER] }, { type: 'null' }] }
      responses:
        '204': { description: OK }
  /tech/jobs:
    get:
      tags: [technician]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [active, past, all], default: all } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Job' } } } }
  /tech/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [technician]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /tech/jobs/{jobId}/stream:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [technician]
      summary: Live updates (SSE), event `job` with the full Job
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
  /tech/jobs/{jobId}/call:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [technician, telephony]
      summary: Masked call to the customer of an assigned job (same rules as POST /bookings/{bookingId}/call)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DialNumber' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /tech/jobs/{jobId}/start-trip:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post: { tags: [technician], responses: { '200': { $ref: '#/components/responses/JobOk' }, '409': { $ref: '#/components/responses/Error' } } }
  /tech/jobs/{jobId}/arrived:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post: { tags: [technician], responses: { '200': { $ref: '#/components/responses/JobOk' }, '409': { $ref: '#/components/responses/Error' } } }
  /tech/jobs/{jobId}/verify-start-code:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [technician]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{4}$' } } }
      responses:
        '200': { $ref: '#/components/responses/JobOk' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /tech/jobs/{jobId}/quotes:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [technician]
      summary: Send the repair quote (MAIN) or extra work (EXTRA). Price-checked before the customer sees it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuoteInput' } } }
      responses:
        '200': { $ref: '#/components/responses/JobOk' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tech/jobs/{jobId}/start-work:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post: { tags: [technician], responses: { '200': { $ref: '#/components/responses/JobOk' }, '409': { $ref: '#/components/responses/Error' } } }
  /tech/jobs/{jobId}/complete:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post: { tags: [technician], responses: { '200': { $ref: '#/components/responses/JobOk' }, '409': { $ref: '#/components/responses/Error' } } }
  /tech/jobs/{jobId}/warranty-fixed:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post: { tags: [technician], summary: A warranty revisit closed as fixed at no charge (INSPECTING), responses: { '200': { $ref: '#/components/responses/JobOk' }, '409': { $ref: '#/components/responses/Error' } } }
  /tech/jobs/{jobId}/parts:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [technician]
      summary: The parts price list for this job's trade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, categoryId, serviceId, name, unit, price]
                  properties:
                    id: { type: string }
                    categoryId: { $ref: '#/components/schemas/CategoryId' }
                    serviceId: { type: [string, 'null'] }
                    name: { $ref: '#/components/schemas/Localized' }
                    unit: { type: string }
                    price: { type: integer }
  /tech/jobs/{jobId}/confirm-cash:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post: { tags: [technician], responses: { '200': { $ref: '#/components/responses/JobOk' }, '409': { $ref: '#/components/responses/Error' } } }
  /tech/jobs/{jobId}/reports:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [technician]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue]
              properties:
                issue: { $ref: '#/components/schemas/TechIssue' }
                note: { type: string, maxLength: 500 }
                location: { $ref: '#/components/schemas/Position' }
      responses:
        '200': { $ref: '#/components/responses/JobOk' }
        '409': { $ref: '#/components/responses/Error' }
  /tech/earnings:
    get:
      tags: [technician]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Earnings' } } } }
  /tech/payout-account:
    get:
      tags: [technician]
      summary: Where the weekly payout goes (null until added); the account number or UPI ID only masked
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/PayoutAccount' }, { type: 'null' }] } } }
    put:
      tags: [technician]
      summary: Add or change the payout details (bank account + IFSC, or a UPI ID); stored encrypted
      description: >-
        Checked by the payout kit: holder name 2-60 letters, spaces or dots as on the bank account; account number 9-18
        digits; IFSC 4 letters, 0, 6 letters or digits (upper-cased); UPI ID name@handle. Details changed in the last
        48 hours are flagged to Housefi HQ before the next payout.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccountInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccount' } } } }
        '404': { description: No technician profile yet, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------- coordinator (API only in v1; for technicians without smartphones) ----------------
  /coordinator/jobs:
    get:
      tags: [coordinator]
      summary: Bookings still searching (oldest first) and the active jobs of this coordinator's technicians
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [searching, assigned]
                properties:
                  searching:
                    type: array
                    items:
                      type: object
                      required: [id, code, serviceId, categoryId, status, area, pincode, time, searchingSince]
                      properties:
                        id: { type: string }
                        code: { type: string }
                        serviceId: { type: string }
                        categoryId: { $ref: '#/components/schemas/CategoryId' }
                        status: { $ref: '#/components/schemas/BookingStatus' }
                        area: { type: string }
                        pincode: { type: string }
                        time: { $ref: '#/components/schemas/VisitTime' }
                        searchingSince: { type: [integer, 'null'] }
                  assigned: { type: array, items: { $ref: '#/components/schemas/Job' } }
  /coordinator/jobs/{jobId}/assign:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [coordinator]
      summary: Assign a MATCHING booking to a technician directly (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [technicianId], properties: { technicianId: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/JobOk' }
  /coordinator/jobs/{jobId}/actions/{action}:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start-trip, arrived, verify-start-code, quotes, start-work, complete, confirm-cash, reports] } }
    post:
      tags: [coordinator]
      summary: Perform a technician action on behalf of a technician without a phone (same body as the technician endpoint; audited)
      responses:
        '200': { $ref: '#/components/responses/JobOk' }

  /coordinator/technicians:
    post:
      tags: [coordinator]
      summary: Register a technician without a smartphone (keypad phone or none); linked to this coordinator
      description: >-
        The profile goes to verification like any other (photo uploaded first with POST /uploads/photos, stage PROFILE).
        409 when the number already has a technician profile or has signed in to the technician app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TechProfileInput'
                - type: object
                  required: [phone, phoneType, photoUploadId]
                  properties:
                    phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
                    phoneType: { type: string, enum: [KEYPAD, NONE] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TechProfile' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /coordinator/technicians/{technicianId}/aadhaar:
    parameters: [ { $ref: '#/components/parameters/TechnicianId' } ]
    post:
      tags: [coordinator, identity]
      summary: Aadhaar Secure QR verification for one of this coordinator's technicians (same as POST /tech/aadhaar)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AadhaarInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AadhaarResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /coordinator/technicians/{technicianId}/phone-setup:
    parameters: [ { $ref: '#/components/parameters/TechnicianId' } ]
    post:
      tags: [coordinator, telephony]
      summary: How the technician receives offers (keypad phone = automatic calls, accepted with 1 and their 4-digit PIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneType]
              properties:
                phoneType: { type: string, enum: [SMARTPHONE, KEYPAD, NONE] }
                pin: { type: string, pattern: '^[0-9]{4}$', description: 'Required for KEYPAD; chosen by the technician; easy PINs (1111, 1234…) are refused' }
                callHours: { type: object, required: [start, end], properties: { start: { type: integer, minimum: 0, maximum: 23 }, end: { type: integer, minimum: 1, maximum: 24 } } }
                consent: { type: boolean, description: 'Consent to automated job calls; required for KEYPAD' }
      responses:
        '204': { description: Saved }
        '422': { $ref: '#/components/responses/Error' }
  /coordinator/technicians/{technicianId}/availability:
    parameters: [ { $ref: '#/components/parameters/TechnicianId' } ]
    post:
      tags: [coordinator]
      summary: Online / offline for one of this coordinator's technicians
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [online], properties: { online: { type: boolean } } } } }
      responses:
        '204': { description: Saved }
  /coordinator/dispatch-queue:
    get:
      tags: [coordinator]
      summary: Bookings no app or phone technician took, oldest first (demo bookings only for demo coordinators)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QueueEntry' } } } } }
  /coordinator/dispatch-queue/{bookingId}/claim:
    parameters: [ { $ref: '#/components/parameters/BookingId' } ]
    post:
      tags: [coordinator]
      summary: Take a queued booking (one coordinator at a time; a claim lapses after 15 minutes)
      responses:
        '204': { description: Claimed }
        '409': { $ref: '#/components/responses/Error' }
  /coordinator/dispatch-queue/{bookingId}/release:
    parameters: [ { $ref: '#/components/parameters/BookingId' } ]
    post:
      tags: [coordinator]
      summary: Give a claimed booking back to the queue
      responses:
        '204': { description: Released }
  /coordinator/jobs/{jobId}/offers:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [coordinator]
      summary: Every offer and phone call for a queued booking or one of this coordinator's jobs (no phone numbers)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OfferHistory' } } } } }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- public verification page ----------------
  /verify/technicians/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9]{24}$' } }
    get:
      tags: [identity]
      security: []
      summary: Public check of a scanned Technician ID card (the QR code's target)
      description: >-
        No sign-in. Rate-limited per IP. The token is random (about 143 bits), stored only as a SHA-256 hash, carries no
        personal data, and can be revoked and re-issued. Returns the minimum and the status right now (a withdrawn approval
        shows immediately). Unknown or revoked tokens are 404. The QR code points to https://housefi.tech/t/#{token}
        (VERIFY_PAGE_URL); the token after "#" never reaches a server log. That page calls this endpoint.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TechVerifyResult' } } } }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    BookingId: { name: bookingId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string }, description: Same id as the booking }
    TechnicianId: { name: technicianId, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    JobOk:
      description: Updated job
      content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
  schemas:
    Position:
      type: object
      description: Where the phone was (SOS and reports); sent only when the phone gives a position
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: [number, 'null'] }
    SupportConversation:
      type: object
      required: [id, state, topic, bookingCode, createdAt, messages]
      properties:
        id: { type: string }
        state: { type: string, enum: [OPEN, CLOSED] }
        topic: { type: string, enum: [BOOKING, PAYMENT, TECHNICIAN, APP, OTHER] }
        bookingCode: { type: [string, 'null'] }
        createdAt: { type: integer }
        messages:
          type: array
          items:
            type: object
            required: [id, from, text, at]
            properties:
              id: { type: string }
              from: { type: string, enum: [ME, HQ, SYSTEM] }
              text: { type: string }
              at: { type: integer }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [VALIDATION, UNAUTHENTICATED, NOT_FOUND, CONFLICT, OTP_INVALID, OTP_EXPIRED, OTP_LOCKED, SLOT_UNAVAILABLE,
                     INSTANT_UNAVAILABLE, PAYMENT_FAILED, OFFER_EXPIRED, NOT_VERIFIED, RATE_LIMITED]
            message: { type: string, description: For logs; the app shows its own translated text }
            attemptsLeft: { type: integer }
            retryAfterSec: { type: integer }
            fields: { type: object, additionalProperties: { type: string, enum: [REQUIRED, INVALID] } }
            requestId: { type: string }
    Locale: { type: string, enum: [en, te] }
    Localized:
      type: object
      required: [en, te]
      properties: { en: { type: string }, te: { type: string } }
    EpochMs: { type: integer, description: Unix time in milliseconds }
    CategoryId: { type: string, enum: [PLUMBING, ELECTRICAL, AC, APPLIANCE, CLEANING, CARPENTRY] }
    OtpChallenge:
      type: object
      required: [challengeId, phone, resendAfterSec, expiresAt, demoCode]
      properties:
        challengeId: { type: string }
        phone: { type: string }
        resendAfterSec: { type: integer, example: 30 }
        expiresAt: { $ref: '#/components/schemas/EpochMs' }
        demoCode: { type: 'null', description: Always null from the real backend }
        demoAccount: { type: boolean, description: 'A team demo number (DEMO_PHONES): no SMS is sent; the team''s fixed code signs in. The app may show a "demo" hint.' }
    AuthResult:
      type: object
      required: [accessToken, refreshToken, expiresIn, isNew]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        isNew: { type: boolean, description: Customer without a name yet / technician without a submitted profile }
        customer: { $ref: '#/components/schemas/Customer' }
        technician: { $ref: '#/components/schemas/TechProfile' }
    Customer:
      type: object
      required: [id, phone, name]
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: string, description: Empty until the name step }
    Greeting:
      type: object
      required: [id, theme, title, body, categoryId, cta, coupon, techBody, until]
      properties:
        id: { type: string, example: diwali-2026 }
        theme: { type: string, description: 'lights, kites, moon, colours, leaves, flag or flowers; the app draws a plain festive look for one it does not know' }
        title: { $ref: '#/components/schemas/Localized' }
        body: { $ref: '#/components/schemas/Localized' }
        categoryId: { oneOf: [{ $ref: '#/components/schemas/CategoryId' }, { type: 'null' }] }
        cta: { oneOf: [{ $ref: '#/components/schemas/Localized' }, { type: 'null' }] }
        coupon: { oneOf: [{ $ref: '#/components/schemas/FestiveCoupon' }, { type: 'null' }], description: 'The festival coupon (festivals.ts names the code, HQ makes it); null unless it exists, is on, within its dates and not used up' }
        techBody: { $ref: '#/components/schemas/Localized' }
        until: { type: integer, description: 'Last moment of the festival days (ms)' }
    FestiveCoupon:
      type: object
      required: [code, kind, value, maxDiscount, minBill, firstBookingOnly, validTo]
      properties:
        code: { type: string, example: DIWALI26 }
        kind: { type: string, enum: [FLAT, PERCENT] }
        value: { type: integer, description: 'Rupees off (FLAT) or percent off (PERCENT)' }
        maxDiscount: { type: [integer, 'null'], description: Rupees; caps a PERCENT coupon }
        minBill: { type: integer, description: Rupees }
        firstBookingOnly: { type: boolean }
        validTo: { type: [integer, 'null'], description: ms }
    Locality:
      type: object
      required: [name, pincodes]
      properties:
        name: { type: string, description: Post office name without its B.O / S.O / H.O ending }
        pincodes: { type: array, items: { type: string } }
    PincodePlaces:
      type: object
      required: [pincode, places]
      properties:
        pincode: { type: string }
        places:
          type: array
          items:
            type: object
            required: [state, district, locality]
            properties: { state: { type: string }, district: { type: string }, locality: { type: string } }
    NearPlace:
      type: object
      required: [state, district, locality, pincode, distanceKm]
      properties:
        state: { type: string }
        district: { type: string }
        locality: { type: string }
        pincode: { type: string }
        distanceKm: { type: [number, 'null'], description: null when India Post has no position for the locality }
    Category:
      type: object
      required: [id, name, tagline, art, wash]
      properties:
        id: { $ref: '#/components/schemas/CategoryId' }
        name: { $ref: '#/components/schemas/Localized' }
        tagline: { $ref: '#/components/schemas/Localized' }
        art: { type: string, enum: [tap, bulb, snowflake, tv, sponge, saw] }
        wash: { type: string, description: Background tint name used by the app }
    Issue:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { $ref: '#/components/schemas/Localized' } }
    Service:
      type: object
      required: [id, categoryId, name, description, visitFee, repairFrom, durationMin, rating, reviews, issues, keywords]
      properties:
        id: { type: string }
        categoryId: { $ref: '#/components/schemas/CategoryId' }
        name: { $ref: '#/components/schemas/Localized' }
        description: { $ref: '#/components/schemas/Localized' }
        visitFee: { type: integer, example: 49 }
        repairFrom: { type: integer, description: 'Typical minimum repair (used by the price check; not shown as a price)' }
        durationMin: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        rating: { type: number }
        reviews: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        keywords: { type: array, items: { type: string } }
        popular: { type: boolean }
    AddressInput:
      type: object
      required: [label, house, street, landmark, city, pincode]
      properties:
        label: { type: string, enum: [HOME, WORK, OTHER] }
        house: { type: string, minLength: 2, maxLength: 120 }
        street: { type: string, minLength: 3, maxLength: 160 }
        landmark: { type: string, maxLength: 120 }
        city: { type: string, minLength: 2, maxLength: 60 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id]
          properties: { id: { type: string } }
    Slot:
      type: object
      required: [id, date, startHour, endHour, state]
      properties:
        id: { type: string, example: '2026-10-17@10' }
        date: { type: string, format: date }
        startHour: { type: integer }
        endHour: { type: integer }
        state: { type: string, enum: [OPEN, FULL, CLOSED] }
    VisitWindow:
      type: object
      required: [date, startHour, endHour]
      properties:
        date: { type: string, format: date }
        startHour: { type: integer, enum: [8, 10, 12, 14, 16, 18] }
        endHour: { type: integer, enum: [10, 12, 14, 16, 18, 20] }
    VisitTime:
      type: object
      required: [mode, window]
      properties:
        mode: { type: string, enum: [INSTANT, SCHEDULED] }
        window: { oneOf: [{ $ref: '#/components/schemas/VisitWindow' }, { type: 'null' }] }
    VoiceNote:
      type: object
      required: [durationSec, transcript]
      properties:
        durationSec: { type: integer, maximum: 60 }
        transcript: { type: string, maxLength: 1000 }
        audioId: { type: string }
        url: { type: string, description: 'In responses only: a 5-minute signed URL to play the recording' }
    Photo:
      type: object
      required: [id]
      properties:
        id: { type: string }
        url: { type: string, description: Short-lived signed URL (responses only) }
    ProblemDescription:
      type: object
      required: [issueIds, notes, voiceNote, photos]
      properties:
        issueIds: { type: array, items: { type: string } }
        notes: { type: string, maxLength: 500 }
        voiceNote: { oneOf: [{ $ref: '#/components/schemas/VoiceNote' }, { type: 'null' }] }
        photos: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/Photo' } }
    NewBooking:
      type: object
      required: [serviceId, problem, addressId, time, preferWomenRated]
      properties:
        serviceId: { type: string }
        problem: { $ref: '#/components/schemas/ProblemDescription' }
        addressId: { type: string }
        time: { $ref: '#/components/schemas/VisitTime' }
        preferWomenRated: { type: boolean }
        repeatOf: { type: string, format: uuid, description: "Book the same technician again: the customer's own earlier booking (completed, or closed without a repair) whose technician is offered the job first. If they decline or miss it, the search goes on as usual." }
    PaymentMethod: { type: string, enum: [UPI, CARD, NETBANKING, CASH] }
    Payment:
      type: object
      required: [kind, amount, state, method, txnId, at]
      properties:
        kind: { type: string, enum: [VISIT, FINAL] }
        amount: { type: integer }
        state: { type: string, enum: [DUE, PROCESSING, PENDING, PAID, FAILED, REFUNDED] }
        method: { oneOf: [{ $ref: '#/components/schemas/PaymentMethod' }, { type: 'null' }] }
        txnId: { type: [string, 'null'] }
        at: { type: [integer, 'null'] }
        discount: { type: integer, description: A coupon's discount (final bill); amount is what is paid after it }
        couponCode: { type: [string, 'null'] }
    PaymentOrder:
      type: object
      required: [paymentId, provider, orderId, keyId, amount]
      properties:
        paymentId: { type: string }
        provider: { type: string, enum: [RAZORPAY] }
        orderId: { type: string }
        keyId: { type: string, description: Razorpay public key id }
        amount: { type: integer, description: rupees }
    PaymentResult:
      type: object
      required: [state, booking]
      properties:
        state: { type: string, enum: [PAID, PENDING, FAILED] }
        booking: { $ref: '#/components/schemas/Booking' }
    Technician:
      type: object
      description: The assigned technician as the customer sees them (identity fields read fresh on every request)
      required: [id, name, gender, rating, jobs, years, womenRated, vehicle, maskedPhone, demo, techCode, photo, verification, verificationSimulated, skills, fictional]
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/Localized' }
        gender: { type: string, enum: [M, F] }
        rating: { type: number }
        jobs: { type: integer }
        years: { type: integer }
        womenRated: { type: boolean }
        vehicle: { type: string }
        maskedPhone: { type: string }
        demo: { type: boolean, description: false from the real backend (the app type will relax this) }
        techCode: { $ref: '#/components/schemas/TechCode' }
        photo: { type: [string, 'null'], description: Short-lived signed URL of the APPROVED photo only; null otherwise }
        verification: { $ref: '#/components/schemas/Verification' }
        verificationSimulated: { type: boolean, description: Always false from the real backend }
        skills: { type: array, items: { $ref: '#/components/schemas/CategoryId' } }
        fictional: { type: boolean, description: Always false from the real backend }
    TechCode:
      type: string
      pattern: '^N9-HF-T-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$'
      description: Permanent Housefi Technician ID. Random suffix from a CSPRNG, unique, never reused or reassigned. Not a credential.
      example: N9-HF-T-7K4M9Q
    Verification:
      type: string
      enum: [PENDING, APPROVED, NEEDS_CORRECTION, REJECTED, SUSPENDED]
    TechIdentity:
      type: object
      required: [techCode, legalName, photo, photoStatus, simulated, correctionRequest]
      properties:
        techCode: { $ref: '#/components/schemas/TechCode' }
        legalName: { type: string, description: As on the identity document; changed only by admin review }
        photo: { type: string, description: Signed URL of the registration photo (the technician sees it even while PENDING) }
        photoStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        simulated: { type: boolean, description: Always false from the real backend }
        correctionRequest:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [kind, note, at]
              properties: { kind: { type: string, enum: [NAME, PHOTO] }, note: { type: string }, at: { type: integer } }
    TechIdCard:
      type: object
      description: Only what is needed to confirm a technician's Housefi identity. Never ID-document images or numbers, date of birth, address or phone.
      required: [techCode, name, photo, photoStatus, gender, skills, verifiedSkills, certifications, verification, simulated, verifyUrl, verifyIsDemo, fictional]
      properties:
        techCode: { $ref: '#/components/schemas/TechCode' }
        name: { type: string }
        photo: { type: [string, 'null'] }
        photoStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        gender: { type: string, enum: [M, F] }
        skills: { type: array, items: { $ref: '#/components/schemas/CategoryId' } }
        verifiedSkills: { type: array, items: { $ref: '#/components/schemas/CategoryId' }, description: Trades proven in the skill check }
        certifications: { type: array, items: { $ref: '#/components/schemas/Certification' } }
        verification: { $ref: '#/components/schemas/Verification' }
        simulated: { type: boolean }
        verifyUrl: { type: string, format: uri, description: 'https://<verification domain>/t/{token}' }
        verifyIsDemo: { type: boolean, description: Always false from the real backend }
        fictional: { type: boolean }
    TechVerifyResult:
      type: object
      required: [techCode, displayName, photo, gender, verification, verifiedSkills, certifications, simulated, active, checkedAt, fictional]
      properties:
        techCode: { $ref: '#/components/schemas/TechCode' }
        displayName: { type: string, description: First name and last initial }
        photo: { type: [string, 'null'], description: Approved photo only }
        gender: { type: string, enum: [M, F] }
        verification: { $ref: '#/components/schemas/Verification' }
        verifiedSkills: { type: array, items: { $ref: '#/components/schemas/CategoryId' }, description: Empty unless active }
        certifications: { type: array, items: { $ref: '#/components/schemas/Certification' }, description: Empty unless active }
        simulated: { type: boolean }
        active: { type: boolean, description: Allowed to work for Housefi right now }
        checkedAt: { type: integer, description: Epoch ms }
        fictional: { type: boolean }
        passport:
          description: The Skill Passport, only when the technician switched it on and is active
          oneOf: [{ $ref: '#/components/schemas/SkillPassport' }, { type: 'null' }]
    SkillPassport:
      type: object
      description: The technician's career as they chose to show it. No phone number, no address.
      required: [memberSince, experienceYears, city, level, jobsDone, rating, ratingCount, trades, courses, certificates]
      properties:
        memberSince: { $ref: '#/components/schemas/EpochMs' }
        experienceYears: { type: integer }
        city: { type: string }
        level: { oneOf: [{ $ref: '#/components/schemas/SkillLevel' }, { type: 'null' }] }
        jobsDone: { type: integer }
        rating: { type: [number, 'null'] }
        ratingCount: { type: integer }
        trades:
          type: array
          items:
            type: object
            required: [categoryId, provenBy, examPoints, examMaxPoints, at]
            properties:
              categoryId: { $ref: '#/components/schemas/CategoryId' }
              provenBy: { type: string, enum: [EXAM, VIDEO, HQ, EARLIER] }
              examPoints: { type: [integer, 'null'], description: Best passed exam score (EXAM only) }
              examMaxPoints: { type: [integer, 'null'] }
              at: { $ref: '#/components/schemas/EpochMs' }
        courses:
          type: array
          items:
            type: object
            required: [title, at]
            properties:
              title: { type: string }
              at: { $ref: '#/components/schemas/EpochMs' }
        certificates: { type: array, items: { $ref: '#/components/schemas/Certification' }, description: Checked by Housefi (not courses) }
    MyPassport:
      type: object
      required: [public, link, passport]
      properties:
        public: { type: boolean, description: Shown on the public QR page }
        link: { type: string, description: The public QR page }
        passport: { $ref: '#/components/schemas/SkillPassport' }
    QuoteLine:
      type: object
      required: [kind, name, qty, unitPrice]
      properties:
        kind: { type: string, enum: [LABOUR, MATERIAL] }
        name: { $ref: '#/components/schemas/Localized' }
        qty: { type: integer, minimum: 1, maximum: 99 }
        unitPrice: { type: integer, minimum: 1 }
    Quote:
      type: object
      required: [id, version, lines, labourTotal, materialTotal, total, diagnosis, review, decision, at]
      properties:
        id: { type: string }
        version: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/QuoteLine' } }
        labourTotal: { type: integer }
        materialTotal: { type: integer }
        total: { type: integer, minimum: 100 }
        diagnosis: { $ref: '#/components/schemas/Localized' }
        review:
          type: object
          required: [state, typicalMin, typicalMax]
          properties:
            state: { type: string, enum: [CHECKING, FAIR, UNDER_REVIEW, CLEARED] }
            typicalMin: { type: integer }
            typicalMax: { type: integer }
        decision: { type: string, enum: [PENDING, APPROVED, REVISION_REQUESTED, REJECTED] }
        at: { $ref: '#/components/schemas/EpochMs' }
    Rating:
      type: object
      required: [satisfied, stars, tags, comment, at]
      properties:
        satisfied: { type: boolean }
        stars: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string, enum: [onTime, polite, clean, fair, explained, fixed] } }
        comment: { type: string, maxLength: 500 }
        at: { $ref: '#/components/schemas/EpochMs' }
    RatingInput:
      type: object
      required: [satisfied, stars, tags, comment]
      properties:
        satisfied: { type: boolean }
        stars: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        comment: { type: string, maxLength: 500 }
        byWoman:
          type: boolean
          default: false
          description: >-
            Optional, self-declared ("I'm a woman"). Used only to compute the technician's women_rated badge
            (at least 5 such ratings averaging 4.5+). Never returned to anyone, never shown with the customer's name.
    BookingStatus:
      type: string
      enum: [AWAITING_PAYMENT, PAYMENT_PENDING, MATCHING, MATCHING_DELAYED, UNFULFILLED, ASSIGNED, EN_ROUTE, ARRIVED, INSPECTING,
             QUOTE_SHARED, IN_PROGRESS, EXTRA_WORK, PAYMENT_DUE, COMPLETED, CLOSED_NO_REPAIR, CANCELLED]
    CancelReason: { type: string, enum: [PLANS_CHANGED, FIXED, TOO_LONG, MISTAKE, OTHER] }
    CloseReason: { type: string, enum: [CUSTOMER_DECLINED, CUSTOMER_UNAVAILABLE, CANNOT_COMPLETE] }
    StatusEvent:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/BookingStatus' }
        at: { $ref: '#/components/schemas/EpochMs' }
    Booking:
      type: object
      required: [id, code, serviceId, categoryId, problem, address, time, preferWomenRated, status, technician, preferredTechnician, arrivalOtp, etaMin, technicianLocation,
                 visitPayment, quote, extraQuote, finalPayment, rating, createdAt, history, cancelReason, closeReason, workStarted, viaTechApp, demo]
      properties:
        id: { type: string }
        code: { type: string, example: HF-48291 }
        serviceId: { type: string }
        categoryId: { $ref: '#/components/schemas/CategoryId' }
        problem: { $ref: '#/components/schemas/ProblemDescription' }
        address: { $ref: '#/components/schemas/Address' }
        time: { $ref: '#/components/schemas/VisitTime' }
        preferWomenRated: { type: boolean }
        status: { $ref: '#/components/schemas/BookingStatus' }
        technician: { oneOf: [{ $ref: '#/components/schemas/Technician' }, { type: 'null' }] }
        preferredTechnician:
          oneOf:
            - { type: object, required: [name], properties: { name: { type: string } }, description: 'Book the same technician again: who is asked first' }
            - { type: 'null' }
        arrivalOtp: { type: string, description: 4 digits; empty string until the visit fee is paid }
        etaMin: { type: [integer, 'null'] }
        technicianLocation:
          oneOf: [{ $ref: '#/components/schemas/TripLocation' }, { type: 'null' }]
          description: Where the technician is, only while EN_ROUTE and only a point at most 10 minutes old; updated over the booking stream about every 60 s
        visitPayment: { $ref: '#/components/schemas/Payment' }
        quote: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }], description: null while not yet visible to the customer }
        extraQuote: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }] }
        finalPayment: { oneOf: [{ $ref: '#/components/schemas/Payment' }, { type: 'null' }] }
        rating: { oneOf: [{ $ref: '#/components/schemas/Rating' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/EpochMs' }
        history: { type: array, items: { $ref: '#/components/schemas/StatusEvent' } }
        cancelReason: { oneOf: [{ $ref: '#/components/schemas/CancelReason' }, { type: 'null' }] }
        closeReason: { oneOf: [{ $ref: '#/components/schemas/CloseReason' }, { type: 'null' }] }
        workStarted: { type: boolean }
        viaTechApp: { type: boolean, description: Always true from the real backend }
        demo: { type: boolean, description: 'A team demo booking (DEMO_PHONES): simulated payments, demo technicians only' }
        warrantyOf: { type: [string, 'null'], description: This booking is a free warranty revisit of that booking (its code) }
        warrantyUntil: { type: [integer, 'null'], description: Until when a free revisit can be asked for (completed jobs) }
        warrantyClaim: { oneOf: [{ type: object, required: [id, code], properties: { id: { type: string }, code: { type: string } } }, { type: 'null' }] }
    TechProfileInput:
      type: object
      required: [name, gender, experienceYears, skills, pincode, vehicle]
      description: >-
        The service area is either state + district + localities from GET /places/... (the PIN code must belong to one
        of the localities, else 422 with `fields.pincode`; city and areas are then filled in from them), or, from older
        apps and coordinators, city + areas as free text.
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        gender: { type: string, enum: [M, F] }
        experienceYears: { type: integer, minimum: 0, maximum: 50 }
        skills: { type: array, minItems: 1, maxItems: 6, items: { $ref: '#/components/schemas/CategoryId' } }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        state: { type: string, minLength: 2, maxLength: 80 }
        district: { type: string, minLength: 2, maxLength: 80 }
        localities: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 80 }, description: 'A name the directory does not have yet is kept as typed; the PIN code must then be in the district' }
        city: { type: string, minLength: 2, maxLength: 60, description: 'Older apps; with the directory: the district' }
        areas: { type: string, minLength: 2, maxLength: 200, description: 'Older apps; with the directory: the localities as one line' }
        vehicle: { type: string, maxLength: 40 }
        photoUploadId:
          type: string
          description: >-
            Required on the first submission (photo uploaded via POST /uploads with kind TECH_PHOTO; live capture or gallery).
            Ignored afterwards. The demo app sends the photo inline as `photo` (data URI) instead.
        phoneType: { type: string, enum: [SMARTPHONE, KEYPAD, NONE], default: SMARTPHONE, description: Set by coordinators; the app sends SMARTPHONE }
    TechProfile:
      allOf:
        - $ref: '#/components/schemas/TechProfileInput'
        - type: object
          required: [id, phone, city, areas, state, district, localities, verification, identity, correctionNote, online, rating, jobsDone]
          properties:
            state: { type: [string, 'null'], description: null on profiles from before the directory }
            district: { type: [string, 'null'] }
            id: { type: string }
            phone: { type: string }
            verification: { oneOf: [{ $ref: '#/components/schemas/Verification' }, { type: 'null' }] }
            identity: { oneOf: [{ $ref: '#/components/schemas/TechIdentity' }, { type: 'null' }], description: null until the first submission }
            aadhaar: { oneOf: [{ $ref: '#/components/schemas/AadhaarResult' }, { type: 'null' }], description: null until verified }
            reviewBy: { type: [integer, 'null'], description: 'When the technician is told the check will be done (ms; 2 h by day, 4 h in the evening, 24 h at night, India time). An approval is shown only from then on. null before the first submission.' }
            correctionNote: { oneOf: [{ $ref: '#/components/schemas/Localized' }, { type: 'null' }] }
            online: { type: boolean }
            rating: { type: [number, 'null'] }
            jobsDone: { type: integer }
            skillCheck: { oneOf: [{ $ref: '#/components/schemas/TechSkillSummary' }, { type: 'null' }], description: null before the first submission }
    TechSkillSummary:
      type: object
      required: [level, required, submittedAt, verifiedSkills, certifications]
      properties:
        level: { oneOf: [{ $ref: '#/components/schemas/SkillLevel' }, { type: 'null' }] }
        required: { type: boolean, description: The skill check still has to be sent (a trade not verified, nothing sent yet) }
        submittedAt: { type: [integer, 'null'] }
        verifiedSkills: { type: array, items: { $ref: '#/components/schemas/CategoryId' }, description: Trades that get job offers }
        certifications: { type: array, items: { $ref: '#/components/schemas/Certification' } }
    Certification:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [ITI, SKILL_INDIA, OTHER, HOUSEFI_COURSE], description: HOUSEFI_COURSE is a Housefi course completed in the app }
        title: { type: string }
    CourseCard:
      type: object
      required: [id, categoryId, level, title, summary, lessons, durationSec, price, access, enrolled, completedLessons, completed]
      properties:
        id: { type: string }
        categoryId: { oneOf: [{ $ref: '#/components/schemas/CategoryId' }, { type: 'null' }] }
        level: { type: string, enum: [BASIC, SAFETY, ADVANCED] }
        title: { $ref: '#/components/schemas/Localized' }
        summary: { $ref: '#/components/schemas/Localized' }
        lessons: { type: integer }
        durationSec: { type: integer }
        price: { type: integer, description: Whole rupees; 0 for basic and safety }
        access: { type: string, enum: [FREE, RATING, PAY] }
        enrolled: { type: boolean }
        completedLessons: { type: integer }
        completed: { type: boolean }
    Courses:
      type: object
      required: [courses, rating, freeFromRating, price]
      properties:
        courses: { type: array, items: { $ref: '#/components/schemas/CourseCard' } }
        rating: { type: [number, 'null'] }
        freeFromRating: { type: number }
        price: { type: integer }
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseCard'
        - type: object
          required: [lessonList, quiz, certificate]
          properties:
            lessonList:
              type: array
              items:
                type: object
                required: [id, title, durationSec, watchedSec, completed]
                properties:
                  id: { type: string }
                  title: { $ref: '#/components/schemas/Localized' }
                  durationSec: { type: integer }
                  watchedSec: { type: integer }
                  completed: { type: boolean }
            quiz:
              type: object
              required: [questions, passCorrect, unlocked, attempts, lastCorrect]
              properties:
                questions: { type: integer }
                passCorrect: { type: integer }
                unlocked: { type: boolean }
                attempts: { type: integer }
                lastCorrect: { type: [integer, 'null'] }
            certificate:
              oneOf:
                - { type: 'null' }
                - { type: object, required: [title, at], properties: { title: { type: string }, at: { type: integer } } }
    CourseOrder:
      type: object
      required: [paymentId, provider, orderId, keyId, amount]
      properties:
        paymentId: { type: string }
        provider: { type: string, enum: [RAZORPAY, SIMULATED] }
        orderId: { type: string }
        keyId: { type: string }
        amount: { type: integer }
    Lesson:
      type: object
      required: [id, title, url, durationSec, watchedSec, completed]
      properties:
        id: { type: string }
        title: { $ref: '#/components/schemas/Localized' }
        url: { type: string, description: Signed link to the video }
        durationSec: { type: integer }
        watchedSec: { type: integer }
        completed: { type: boolean }
    CourseQuiz:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [n, q, options]
            properties:
              n: { type: integer }
              q: { $ref: '#/components/schemas/Localized' }
              options: { type: array, items: { type: object, required: [id, en, te], properties: { id: { type: string }, en: { type: string }, te: { type: string } } } }
    CourseQuizResult:
      type: object
      required: [correct, total, passed, course]
      properties:
        correct: { type: integer }
        total: { type: integer }
        passed: { type: boolean }
        course: { $ref: '#/components/schemas/Course' }
    SkillLevel: { type: string, enum: [UNSKILLED, SEMI_SKILLED, SKILLED, HIGHLY_SKILLED] }
    SkillLevelInput:
      type: object
      required: [level]
      properties: { level: { $ref: '#/components/schemas/SkillLevel' } }
    SkillExamStart:
      type: object
      required: [categoryId]
      properties: { categoryId: { $ref: '#/components/schemas/CategoryId' } }
    SkillExamAnswer:
      type: object
      required: [optionId]
      properties: { optionId: { type: string, pattern: '^[a-f]$' } }
    SkillVideoInput:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [LIVE, UPLOAD, SAMPLE], description: SAMPLE (no file) for the team's demo accounts only }
        uploadId: { type: string, description: Required for LIVE and UPLOAD }
    SkillCertificateInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [ITI, SKILL_INDIA, OTHER] }
        title: { type: string, maxLength: 80 }
        uploadId: { type: string }
        sample: { type: boolean, description: No file, for the team's demo accounts only }
    SkillReview: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    SkillCheck:
      type: object
      required: [level, required, submittedAt, canSubmit, demo, trades, video, certificates, rules]
      properties:
        level: { oneOf: [{ $ref: '#/components/schemas/SkillLevel' }, { type: 'null' }] }
        required: { type: boolean }
        submittedAt: { type: [integer, 'null'] }
        canSubmit: { type: boolean }
        demo: { type: boolean }
        trades:
          type: array
          items:
            type: object
            required: [categoryId, verifiedVia, verifiedAt, exam]
            properties:
              categoryId: { $ref: '#/components/schemas/CategoryId' }
              verifiedVia: { type: [string, 'null'], enum: [EXAM, VIDEO, HQ, EARLIER, null] }
              verifiedAt: { type: [integer, 'null'] }
              exam:
                type: object
                required: [state, attemptId, points, maxPoints, retakeAt]
                properties:
                  state: { type: string, enum: [NONE, IN_PROGRESS, PASSED, FAILED] }
                  attemptId: { type: [string, 'null'] }
                  points: { type: [integer, 'null'] }
                  maxPoints: { type: integer }
                  retakeAt: { type: [integer, 'null'] }
        video:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [id, source, status, durationSec, categoryIds, reviewNote, createdAt]
              properties:
                id: { type: string }
                source: { type: string, enum: [LIVE, UPLOAD, SAMPLE] }
                status: { $ref: '#/components/schemas/SkillReview' }
                durationSec: { type: [integer, 'null'] }
                categoryIds: { type: array, items: { $ref: '#/components/schemas/CategoryId' } }
                reviewNote: { type: [string, 'null'] }
                createdAt: { type: integer }
        certificates:
          type: array
          items:
            type: object
            required: [id, kind, title, status, sample, reviewNote, createdAt]
            properties:
              id: { type: string }
              kind: { type: string, enum: [ITI, SKILL_INDIA, OTHER] }
              title: { type: string }
              status: { $ref: '#/components/schemas/SkillReview' }
              sample: { type: boolean }
              reviewNote: { type: [string, 'null'] }
              createdAt: { type: integer }
        rules:
          type: object
          required: [sections, passPercent, maxLeftApp, minVideoSec, maxVideoSec, maxCertificates, retakeAfterSec]
          properties:
            sections: { type: array, items: { $ref: '#/components/schemas/SkillExamSectionRule' } }
            passPercent: { type: integer }
            maxLeftApp: { type: integer }
            minVideoSec: { type: integer }
            maxVideoSec: { type: integer }
            maxCertificates: { type: integer }
            retakeAfterSec: { type: integer }
    SkillExamSectionRule:
      type: object
      required: [type, count, limitSec]
      properties:
        type: { type: string, enum: [MCQ, DIAGRAM, SELECT] }
        count: { type: integer }
        limitSec: { type: integer }
    SkillExam:
      type: object
      description: The paper as the technician sees it. Never the right answers; the result says only right or wrong per question.
      required: [id, categoryId, level, state, serverNow, startedAt, endsAt, sections, currentSection, questions, answers, leftApp, maxLeftApp, result]
      properties:
        id: { type: string }
        categoryId: { $ref: '#/components/schemas/CategoryId' }
        level: { $ref: '#/components/schemas/SkillLevel' }
        state: { type: string, enum: [IN_PROGRESS, SUBMITTED] }
        serverNow: { type: integer, description: The server's clock (ms) for the time left }
        startedAt: { type: integer }
        endsAt: { type: integer }
        sections:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SkillExamSectionRule'
              - type: object
                required: [startedAt, endsAt]
                properties: { startedAt: { type: [integer, 'null'] }, endsAt: { type: [integer, 'null'] } }
        currentSection: { type: integer, description: -1 before the first section is opened }
        questions:
          type: array
          items:
            type: object
            required: [id, section, type, q, art, options]
            properties:
              id: { type: string }
              section: { type: integer }
              type: { type: string, enum: [MCQ, DIAGRAM, SELECT] }
              q: { $ref: '#/components/schemas/Localized' }
              art: { type: [string, 'null'], description: A picture the app draws (diagram labelled A-D, or a joining task) }
              options:
                type: array
                items:
                  type: object
                  required: [id, en, te, art]
                  properties:
                    id: { type: string }
                    en: { type: [string, 'null'] }
                    te: { type: [string, 'null'] }
                    art: { type: [string, 'null'] }
        answers: { type: object, additionalProperties: { type: string }, description: question id to option id }
        leftApp: { type: integer }
        maxLeftApp: { type: integer }
        result:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [correct, total, points, basePoints, bonusPoints, maxPoints, passPoints, passed, autoSubmitted, retakeAt, questions]
              properties:
                correct: { type: integer }
                total: { type: integer }
                points: { type: integer }
                basePoints: { type: integer }
                bonusPoints: { type: integer }
                maxPoints: { type: integer }
                passPoints: { type: integer }
                passed: { type: boolean }
                autoSubmitted: { type: boolean }
                retakeAt: { type: [integer, 'null'] }
                questions:
                  type: array
                  items:
                    type: object
                    required: [questionId, correct, fast, points, changes, secondsTaken]
                    properties:
                      questionId: { type: string }
                      correct: { type: boolean }
                      fast: { type: boolean }
                      points: { type: integer }
                      changes: { type: integer }
                      secondsTaken: { type: [integer, 'null'] }
    JobOffer:
      type: object
      required: [id, bookingId, code, serviceId, categoryId, issueIds, notes, photoCount, area, pincode, time, distanceKm, visitEarning, createdAt, expiresAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        code: { type: string }
        serviceId: { type: string }
        categoryId: { $ref: '#/components/schemas/CategoryId' }
        issueIds: { type: array, items: { type: string } }
        notes: { type: string }
        photoCount: { type: integer }
        area: { type: string, description: 'Locality and city only; never the house number' }
        pincode: { type: string }
        time: { $ref: '#/components/schemas/VisitTime' }
        distanceKm: { type: number }
        visitEarning: { type: integer }
        createdAt: { $ref: '#/components/schemas/EpochMs' }
        expiresAt: { $ref: '#/components/schemas/EpochMs' }
    TechIssue: { type: string, enum: [CUSTOMER_UNAVAILABLE, WRONG_ADDRESS, UNSAFE, CANNOT_COMPLETE, PAYMENT_PROBLEM, OTHER] }
    Job:
      type: object
      required: [id, code, serviceId, categoryId, problem, customerName, address, maskedPhone, time, status, quote, extraQuote, visitPayment,
                 finalPayment, workStarted, closeReason, cancelReason, otpAttemptsLeft, earning, rating, history, acceptedAt, practice, demo]
      properties:
        id: { type: string }
        code: { type: string }
        serviceId: { type: string }
        categoryId: { $ref: '#/components/schemas/CategoryId' }
        problem: { $ref: '#/components/schemas/ProblemDescription' }
        customerName: { type: string, description: First name only }
        address: { $ref: '#/components/schemas/Address' }
        maskedPhone: { type: string }
        time: { $ref: '#/components/schemas/VisitTime' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        quote: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }], description: Includes CHECKING / UNDER_REVIEW quotes }
        extraQuote: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }] }
        visitPayment: { $ref: '#/components/schemas/Payment' }
        finalPayment: { oneOf: [{ $ref: '#/components/schemas/Payment' }, { type: 'null' }] }
        workStarted: { type: boolean }
        closeReason: { oneOf: [{ $ref: '#/components/schemas/CloseReason' }, { type: 'null' }] }
        cancelReason: { oneOf: [{ $ref: '#/components/schemas/CancelReason' }, { type: 'null' }] }
        otpAttemptsLeft: { type: integer }
        earning: { type: integer }
        rating: { oneOf: [{ $ref: '#/components/schemas/Rating' }, { type: 'null' }] }
        history: { type: array, items: { $ref: '#/components/schemas/StatusEvent' } }
        acceptedAt: { $ref: '#/components/schemas/EpochMs' }
        practice: { type: boolean, description: Always false from the real backend }
        demo: { type: boolean }
        warrantyOf: { type: [string, 'null'], description: A free warranty revisit of that booking (fix at no charge, or quote for a new problem) }
    QuoteInput:
      type: object
      required: [which, diagnosis, lines]
      properties:
        which: { type: string, enum: [MAIN, EXTRA] }
        diagnosis: { type: string, minLength: 3, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [kind, name, qty, unitPrice]
            properties:
              kind: { type: string, enum: [LABOUR, MATERIAL] }
              name: { type: string, minLength: 1, maxLength: 80 }
              qty: { type: integer, minimum: 1, maximum: 99 }
              unitPrice: { type: integer, minimum: 1, maximum: 100000 }
              partId: { type: string, description: A part from the price list (materials only) }
    PayoutAccountInput:
      type: object
      required: [rail, holderName]
      properties:
        rail: { type: string, enum: [BANK, UPI] }
        holderName: { type: string, maxLength: 100, description: As on the bank account }
        accountNumber: { type: string, maxLength: 40, description: BANK only }
        ifsc: { type: string, maxLength: 20, description: BANK only }
        upiId: { type: string, maxLength: 300, description: UPI only }
    PayoutAccount:
      type: object
      required: [rail, holderName, hint, updatedAt]
      properties:
        rail: { type: string, enum: [BANK, UPI] }
        holderName: { type: string }
        hint: { type: string, description: 'Masked, e.g. XXXXXX1234 · SBIN0001234 or r*****@okicici', example: XXXXXXX2101 · SBIN0001234 }
        updatedAt: { type: integer, format: int64, description: Epoch milliseconds }
    Earnings:
      type: object
      required: [today, jobsToday, total, pendingPayout, nextPayoutOn, entries, weeks]
      properties:
        today: { type: integer }
        jobsToday: { type: integer }
        total: { type: integer }
        pendingPayout: { type: integer }
        nextPayoutOn: { type: string, format: date }
        entries:
          type: array
          items:
            type: object
            required: [jobId, code, serviceId, amount, at, payout]
            properties:
              jobId: { type: string }
              code: { type: string }
              serviceId: { type: string }
              amount: { type: integer }
              at: { $ref: '#/components/schemas/EpochMs' }
              payout: { type: string, enum: [PENDING, PAID] }
        weeks:
          type: array
          description: This week and the 7 before it (IST, Monday to Sunday), newest first. Each week is paid on the Monday after it.
          items:
            type: object
            required: [start, end, earned, cash, jobs, payout]
            properties:
              start: { type: string, format: date, description: Monday }
              end: { type: string, format: date, description: Sunday }
              earned: { type: integer, description: 'Job credits that week (rupees)' }
              cash: { type: integer, description: 'Cash collected from customers that week, netted in the payout (rupees)' }
              jobs: { type: integer }
              payout:
                type: object
                required: [state, on, amount, ref]
                properties:
                  state: { type: string, enum: [UPCOMING, PENDING, PROCESSING, PAID, FAILED, CARRIED, NONE], description: 'CARRIED = added to a later payout (no payout of its own); NONE = nothing earned' }
                  on: { type: [string, 'null'], format: date, description: 'The Monday it is paid on; for PAID the day it was paid' }
                  amount: { type: [integer, 'null'], description: 'The payout amount (may include earlier weeks carried over)' }
                  ref: { type: [string, 'null'], description: 'Bank / UPI reference once paid' }
    Chat:
      type: object
      required: [bookingId, open, clearable, clearsAt, messages]
      properties:
        bookingId: { type: string }
        open: { type: boolean, description: Messages can be sent (from assignment until the job is done) }
        clearable: { type: boolean, description: The job is done; either side can clear the chat }
        clearsAt: { oneOf: [{ $ref: '#/components/schemas/EpochMs' }, { type: 'null' }], description: When it clears by itself (24 h after the job) }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' }, description: Oldest first }
    ChatMessage:
      type: object
      required: [id, from, text, photo, at]
      properties:
        id: { type: string }
        from: { type: string, enum: [ME, THEM] }
        text: { type: string }
        photo: { type: [string, 'null'], description: Short-lived link }
        at: { $ref: '#/components/schemas/EpochMs' }
    ChatMessageInput:
      type: object
      properties:
        text: { type: string, maxLength: 1000 }
        photoUploadId: { type: string, description: An upload with stage CHAT }
    ChatSummary:
      type: object
      required: [bookingId, code, open, unread]
      properties:
        bookingId: { type: string }
        code: { type: string }
        open: { type: boolean }
        unread: { type: integer }
    UploadTicket:
      type: object
      required: [id, uploadUrl, expiresAt]
      properties:
        id: { type: string, description: photoId / audioId to send in NewBooking or AI calls }
        uploadUrl: { type: string, description: Pre-signed S3 PUT URL }
        expiresAt: { $ref: '#/components/schemas/EpochMs' }
    PhotoSuggestion:
      type: object
      required: [serviceId, confidence, alternatives]
      properties:
        serviceId: { type: [string, 'null'] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        alternatives: { type: array, items: { type: string } }
    LocalTopProblems:
      type: object
      required: [area, items]
      properties:
        area: { type: [string, 'null'] }
        items:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [serviceId, issueId, recentCount]
            properties:
              serviceId: { type: string }
              issueId: { type: string }
              recentCount: { type: integer }
    ChatReply:
      type: object
      required: [text, suggestions, offerHuman, links, action]
      properties:
        text: { type: string }
        suggestions: { type: array, items: { type: string } }
        offerHuman: { type: boolean }
        links:
          type: array
          description: Links to show under the answer (e.g. the founders' profiles)
          items: { type: object, required: [label, url], properties: { label: { type: string }, url: { type: string } } }
        action:
          description: >-
            Something the app may do once the customer confirms it, never done by the assistant itself. CANCEL_BOOKING
            only before the technician starts the trip, with a checked reason; the app then calls POST
            /bookings/{bookingId}/cancel with that reason, which checks everything again.
          oneOf:
            - type: object
              required: [kind, bookingId, code, reason, refund]
              properties:
                kind: { type: string, enum: [CANCEL_BOOKING] }
                bookingId: { type: string }
                code: { type: string }
                reason: { type: string, enum: [PLANS_CHANGED, FIXED, TOO_LONG, MISTAKE, OTHER] }
                refund: { type: integer, description: Rupees refunded }
            - { type: 'null' }
        conversationId: { type: string }
    AppNotification:
      type: object
      required: [id, kind, bookingId, params, at, read]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [TECH_ASSIGNED, TECH_ON_THE_WAY, TECH_ARRIVED, QUOTE_READY, EXTRA_QUOTE, PAYMENT_DUE, BOOKING_COMPLETED, BOOKING_CANCELLED,
                 NO_TECHNICIAN, JOB_OFFER, QUOTE_APPROVED, QUOTE_REVISION, QUOTE_DECLINED, EXTRA_APPROVED, EXTRA_DECLINED, PAYMENT_RECEIVED,
                 JOB_CANCELLED, PROFILE_APPROVED, PROFILE_NEEDS_CORRECTION, PAY_REMINDER, BOOKING_REMINDER, JOB_REMINDER, QUOTE_REMINDER,
                 RATE_REMINDER, PROFILE_SUSPENDED, PROFILE_REINSTATED, PROFILE_REJECTED, BOOKING_TOMORROW, JOB_TOMORROW, JOB_DAY_PLAN,
                 CHAT_MESSAGE, SUPPORT_REPLY, ANNOUNCEMENT]
          description: >-
            Reminders: PAY_REMINDER {code, minutes} 10 min before an unpaid booking expires; BOOKING_REMINDER / JOB_REMINDER
            {code, startHour} an hour before a scheduled visit; BOOKING_TOMORROW / JOB_TOMORROW {code, startHour, endHour}
            from 19:00 IST the evening before; JOB_DAY_PLAN {code, count, startHour} from 07:30 IST, the technician's
            scheduled jobs that day (code = the first); QUOTE_REMINDER {code} after a quote waits 10 min;
            RATE_REMINDER {code} 2 h after completion if unrated. The app should show unknown kinds generically.
        bookingId: { type: [string, 'null'] }
        params: { type: object, additionalProperties: { type: [string, number] } }
        at: { $ref: '#/components/schemas/EpochMs' }
        read: { type: boolean }
    DialNumber:
      type: object
      required: [dialNumber]
      properties:
        dialNumber: { type: string, description: The Housefi number (ExoPhone) to dial }
    TripLocation:
      type: object
      required: [lat, lng, accuracyM, at]
      properties:
        lat: { type: number }
        lng: { type: number }
        accuracyM: { type: [integer, 'null'] }
        at: { $ref: '#/components/schemas/EpochMs' }
    AadhaarInput:
      type: object
      required: [qr]
      properties:
        qr: { type: string, minLength: 50, maxLength: 8000, description: The text of the Aadhaar Secure QR code (a long decimal number) }
    AadhaarResult:
      type: object
      required: [last4, nameMatches, genderMatches, verifiedAt]
      properties:
        last4: { type: string, pattern: '^[0-9]{4}$' }
        nameMatches: { type: boolean, description: 'false: the legal name differs from the Aadhaar name; approval waits for a review' }
        genderMatches: { type: boolean, description: 'false: the gender on the Aadhaar differs from the profile; approval waits until the technician corrects it in the profile (an Aadhaar saying T never blocks)' }
        verifiedAt: { $ref: '#/components/schemas/EpochMs' }
    QueueEntry:
      type: object
      required: [bookingId, code, serviceId, categoryId, area, pincode, reason, enteredAt, claimedBy, claimedAt]
      properties:
        bookingId: { type: string }
        code: { type: string }
        serviceId: { type: string }
        categoryId: { $ref: '#/components/schemas/CategoryId' }
        area: { type: string }
        pincode: { type: string }
        reason: { type: string }
        enteredAt: { $ref: '#/components/schemas/EpochMs' }
        claimedBy: { type: [string, 'null'], description: Coordinator id }
        claimedAt: { type: [integer, 'null'] }
    OfferHistory:
      type: object
      required: [offerId, technicianId, channel, state, createdAt, respondedAt, calls]
      properties:
        offerId: { type: string }
        technicianId: { type: string }
        channel: { type: string, enum: [APP, SMS, IVR, COORDINATOR] }
        state: { type: string }
        createdAt: { $ref: '#/components/schemas/EpochMs' }
        respondedAt: { type: [integer, 'null'] }
        calls:
          type: array
          items:
            type: object
            required: [state, keypad, requestedAt, durationS]
            properties:
              state: { type: string }
              keypad: { type: [string, 'null'] }
              requestedAt: { $ref: '#/components/schemas/EpochMs' }
              durationS: { type: [integer, 'null'] }
