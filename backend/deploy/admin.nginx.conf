# Housefi HQ behind the Cloudflare Tunnel, only for the portal's secret host (ADMIN_HOST). The site itself, and
# /v1/admin/ passed to the API (which answers only for that host). Nothing else of the API is reachable from here.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;

  # Strict: our own scripts and styles only, no frames, passkeys and the microphone (talking to Sarathi) for this page only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(), microphone=(self), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Sarathi takes a photo with a question (resized in the browser, at most ~2 MB); every other request stays small.
  # A course lesson video (at most 100 MB, the most Cloudflare passes), streamed on to the API.
  location ~ ^/v1/admin/courses/[a-z0-9-]+/lessons/[a-z0-9-]+/video$ {
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location = /v1/admin/guide/messages {
    client_max_body_size 2m;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location /v1/admin/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # Any other API path: not here.
  location /v1/ {
    return 404;
  }

  # The built files have content hashes in their names: cached for a year. The page itself: never cached.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # (A location's own add_header replaces the server's, so the rest are repeated here.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
