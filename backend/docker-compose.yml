# Local development services. Start with: docker compose up -d
# Credentials here are for local use only and match .env.example.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: housefi
      POSTGRES_PASSWORD: housefi
      POSTGRES_DB: housefi
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housefi -d housefi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 stand-in (the official MinIO images are no longer published on Docker Hub). It accepts any
  # credentials and does not check signatures, so it is for development only; real S3 enforces both.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: housefi-dev-uploads
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["9090:9090"]
    volumes: [s3-data:/s3mockroot]

volumes:
  postgres-data:
  s3-data:
